name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read

jobs:
  audit-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit cyclonedx-bom
      - name: pip-audit (known vulnerabilities in the installed set)
        run: pip-audit --desc on --skip-editable
      - name: SBOM (CycloneDX)
        run: cyclonedx-py environment --output-format json --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
